<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Checkout | H&JPERFUMES</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">H&JPERFUMES</div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="cart.html">Cart</a></li>
    </ul>

    <div class="nav-right">
        <button class="lang-btn" onclick="setLang('ar')">عربي</button>

        <div class="icon cart" onclick="goToCart()">
            🛒<span id="cart-count">0</span>
        </div>
    </div>
</nav>


<!-- CHECKOUT PAGE -->
<section class="checkout-page">
    <h1>Checkout</h1>

    <div class="checkout-layout">
        <div class="checkout-summary">
            <h2>Your Order</h2>
            <div id="checkout-items"></div>

            <div class="summary-total">
                <span>Total</span>
                <span id="checkout-total">AED 0</span>
            </div>
        </div>

        <div class="checkout-details">
            <h2>Contact Details</h2>

            <label>Your Name</label>
            <input type="text" id="customer-name" placeholder="Enter your name">

            <label>Your Phone</label>
            <input type="text" id="customer-phone" placeholder="Enter your phone number">

            <p class="note">We will confirm your order via WhatsApp.</p>

            <button class="btn-primary" onclick="sendOrderToWhatsApp()">
                Confirm via WhatsApp
            </button>
        </div>
    </div>
</section>


<!-- FOOTER -->
<footer class="footer">
    <p>© 2026 H&JPERFUMES. All rights reserved.</p>

    <p>
        <a href="https://wa.me/971502287387" target="_blank" class="whatsapp-link">
            Contact us on WhatsApp: 0502287387
        </a>
    </p>
</footer>

<script src="script.js"></script>
<script>
    initLanguage();
    updateCartCount();
    displayCheckout();

    function sendOrderToWhatsApp() {
        const name = document.getElementById("customer-name").value;
        const phone = document.getElementById("customer-phone").value;
        const total = document.getElementById("checkout-total").innerText;

        const message =
            `Hello, I want to confirm my order.%0A%0A` +
            `Name: ${name}%0A` +
            `Phone: ${phone}%0A` +
            `Total: ${total}%0A%0A` +
            `Please confirm my order.`;

        window.location.href = `https://wa.me/971502287387?text=${message}`;
    }
</script>

</body>
</html>
