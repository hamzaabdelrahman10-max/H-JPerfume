<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>عطور H&J | الرئيسية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="rtl">

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">H&JPERFUMES</div>

    <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="cart.html">Cart</a></li>
    </ul>

    <div class="nav-right">
        <button class="lang-btn" onclick="switchToArabic()">عربي</button>

        <!-- FIXED: Cart icon now opens the correct cart page -->
        <div class="icon cart" onclick="goToCart()">
            🛒<span id="cart-count">0</span>
        </div>
    </div>
</nav>


<!-- HERO SECTION -->
<header class="hero hero-dark fade-in">
    <div class="hero-text">
        <h1>عطور H&J</h1>
        <p>عطور نيش فاخرة صُممت للحظات لا تُنسى.</p>
        <a href="shop-ar.html" class="btn-primary">استكشف المجموعة</a>
    </div>
</header>

<!-- PREMIUM SAMPLES SECTION -->
<section class="samples-banner premium-samples fade-in">
    <div class="samples-content">
        <h2>عينات مجانية للفعالية</h2>

        <p class="samples-count">
            نقدّم <span id="sample-count">20</span> عينة عطر مجانية.
        </p>

        <p class="samples-sub">اطلب عينتك الآن قبل نفاد الكمية.</p>

        <button class="btn-primary sample-btn-main" onclick="orderSample('عينة مجانية')">
            اطلب عينة
        </button>
    </div>
</section>

<!-- FEATURED PERFUMES -->
<section class="featured-showcase fade-in">
    <h2>عطور مميزة</h2>

    <div class="featured-row">

        <div class="featured-item fade-in">
            <img src="gissa.png" alt="Gissa">
            <h3>قصه</h3>
        </div>

        <div class="featured-item fade-in">
            <img src="madawi.png" alt="Madawi">
            <h3>مضاوي</h3>
        </div>

        <div class="featured-item fade-in">
            <img src="lahab.png" alt="Lahab">
            <h3>لهب</h3>
        </div>

    </div>
</section>

<!-- FOOTER -->
<footer class="footer fade-in">
    <p>© 2026 عطور H&J. جميع الحقوق محفوظة.</p>
</footer>

<script src="script.js"></script>
<script>
    // ⚠️ To avoid refresh loop, do NOT call initLanguage() here
    // Arabic page is already ar, so we just init samples + cart

    initSampleCount();
    updateSampleDisplay();
    updateSampleButtons();
    updateCartCount();
</script>

</body>
</html>
