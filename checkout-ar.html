            <p class="note">سيتم تأكيد طلبك عبر الواتساب.</p>

            <button class="btn-primary" onclick="sendOrderToWhatsApp()">تأكيد عبر الواتساب</button>
        </div>
    </div>
</section>

<footer class="footer">
    <p>© 2026 إتش آند جي للعطور. جميع الحقوق محفوظة.</p>
</footer>

<script src="script.js"></script>
