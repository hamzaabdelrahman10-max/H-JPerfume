<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إتمام الطلب | إتش آند جي للعطور</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="rtl">

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">H&JPERFUMES</div>

    <ul class="nav-links">
        <li><a href="index-ar.html">الرئيسية</a></li>
        <li><a href="shop-ar.html">المتجر</a></li>
        <li><a href="cart-ar.html">السلة</a></li>
    </ul>

    <div class="nav-right">
        <button class="lang-btn" onclick="setLang('en')">English</button>

        <div class="icon cart" onclick="goToCart()">
            🛒<span id="cart-count">0</span>
        </div>
    </div>
</nav>


<!-- CHECKOUT PAGE -->
<section class="checkout-page">
    <h1>إتمام الطلب</h1>

    <div class="checkout-layout">
        <div class="checkout-summary">
            <h2>طلبك</h2>
            <div id="checkout-items"></div>

            <div class="summary-total">
                <span>الإجمالي</span>
                <span id="checkout-total">0 درهم</span>
            </div>
        </div>

        <div class="checkout-details">
            <h2>بيانات التواصل</h2>

            <label>الاسم</label>
            <input type="text" id="customer-name" placeholder="اكتب اسمك">

            <label>رقم الهاتف</label>
            <input type="text" id="customer-phone" placeholder="اكتب رقم هاتفك">

            <p class="note">سيتم تأكيد طلبك عبر الواتساب.</p>

            <button class="btn-primary" onclick="sendOrderToWhatsApp()">
                تأكيد عبر الواتساب
            </button>
        </div>
    </div>
</section>


<!-- FOOTER -->
<footer class="footer">
    <p>© 2026 إتش آند جي للعطور. جميع الحقوق محفوظة.</p>

    <p>
        <a href="https://wa.me/971502287387" target="_blank" class="whatsapp-link">
            تواصل معنا عبر الواتساب: 0502287387
        </a>
    </p>
</footer>

<script src="script.js"></script>
<script>
    updateCartCount();
    displayCheckout();

    function sendOrderToWhatsApp() {
        const name = document.getElementById("customer-name").value;
        const phone = document.getElementById("customer-phone").value;
        const total = document.getElementById("checkout-total").innerText;

        const message =
            `مرحباً، أرغب في تأكيد طلبي.%0A%0A` +
            `الاسم: ${name}%0A` +
            `رقم الهاتف: ${phone}%0A` +
            `الإجمالي: ${total}%0A%0A` +
            `يرجى تأكيد الطلب.`;

        window.location.href = `https://wa.me/971502287387?text=${message}`;
    }
</script>

</body>
</html>
